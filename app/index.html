<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tutobridge – Find trusted tutors in Lahore</title>
<meta name="description" content="Find verified tutors near you in Lahore. Chat, book a trial, and manage your tuition in one place.">
<meta name="theme-color" content="#D4FF00">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--brand:#D4FF00;--brandD:#B8E600;--soft:#F2F2F2;--ink:#111;--muted:#595959;--line:#E5E5E5;--ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#fff;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
.hidden{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1.5px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:62px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;text-decoration:none;letter-spacing:-.3px}
.brand i{width:36px;height:36px;border-radius:11px;background:var(--brand);display:grid;place-items:center}
.top nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nb{border:0;background:none;padding:9px 13px;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;text-decoration:none}
.nb:hover{background:var(--soft)}.nb.on{background:var(--brand)}
.nb .dot{min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
@media(max-width:640px){.nb .tx{display:none}.nb{padding:9px 11px;font-size:18px}}

/* layout */
main{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
.narrow{max-width:560px;margin:0 auto}
.mid{max-width:760px;margin:0 auto}
.screen{animation:rise .45s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.st{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
h1{font-size:30px;margin:4px 0 6px;letter-spacing:-.6px;line-height:1.15}
h2{font-size:22px;margin:6px 0;letter-spacing:-.4px}
h3{font-size:16px;margin:18px 0 8px}
.muted{color:var(--muted)}.small{font-size:12.5px}.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.back{border:0;background:none;font-weight:800;cursor:pointer;padding:6px 0;margin-bottom:6px;display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.back:hover{color:var(--ink)}

/* buttons */
.btn{border:0;border-radius:16px;min-height:50px;padding:0 20px;font-weight:800;font-size:15px;cursor:pointer;background:var(--brand);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s var(--spring),background .2s,box-shadow .2s;text-decoration:none}
.btn:hover{background:var(--brandD);transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn.full{width:100%}.btn.sm{min-height:40px;font-size:13.5px;padding:0 14px;border-radius:13px}
.btn.out{background:#fff;border:2px solid var(--ink)}.btn.out:hover{background:var(--soft)}
.btn.ghost{background:none;border:0;min-height:36px;padding:0 8px;text-decoration:underline}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.link{border:0;background:none;font-weight:800;cursor:pointer;text-decoration:underline;padding:4px}

/* cards & pills */
.card{background:#fff;border:1.5px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;transition:box-shadow .25s,transform .25s var(--ease)}
.card:hover{box-shadow:0 10px 28px rgba(17,17,17,.07)}
.card.star{border:2.5px solid var(--ink)}
.card.lime{background:var(--brand);border-color:var(--ink)}
.card.soft{background:var(--soft);border-color:transparent}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 11px;font-weight:800;font-size:12px;background:var(--soft);white-space:nowrap}
.pill.lime{background:var(--brand)}.pill.ink{background:var(--ink);color:#fff}.pill.out{background:#fff;border:1.5px solid var(--line)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.hint{background:var(--brand);border-radius:14px;padding:11px 13px;font-size:13.5px;display:flex;gap:8px;margin:10px 0}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:9px 14px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:transform .2s var(--spring),background .2s,border-color .2s}
.chip:hover{transform:translateY(-1px)}.chip.on{background:var(--brand);border:2px solid var(--ink)}

/* forms */
label.f{display:block;margin-bottom:14px}
label.f>span{display:block;font-weight:800;font-size:13.5px;margin-bottom:6px}
.inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 14px;background:#fff;outline:none;transition:border-color .2s;font-size:15px}
.inp:focus{border-color:var(--ink)}
textarea.inp{resize:vertical;min-height:84px}
.help{font-size:12px;color:var(--muted);margin-top:5px}
.err{font-size:12.5px;font-weight:800;margin-top:5px}
.inp.bad{border-color:var(--ink);background:#fffbe6}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:14px;overflow:hidden}
.seg button{border:0;background:#fff;padding:9px 16px;font-weight:800;cursor:pointer;font-size:13.5px}
.seg button.on{background:var(--brand)}
.seg button+button{border-left:2px solid var(--ink)}
.switch{position:relative;width:52px;height:30px;flex:none;border:0;border-radius:15px;background:#ccc;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s var(--spring)}
.switch.on{background:var(--ink)}.switch.on::after{transform:translateX(22px)}
.check{display:flex;gap:10px;align-items:center;font-weight:700;cursor:pointer;margin:6px 0 14px}
.check input{width:20px;height:20px;accent-color:#111}

/* avatar */
.av{border-radius:50%;background:var(--brand);display:grid;place-items:center;font-weight:800;flex:none;overflow:hidden;border:2px solid var(--ink)}
.av img{width:100%;height:100%;object-fit:cover}

/* welcome */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:24px 0}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:44px}
@media(max-width:640px){.hero h1{font-size:34px}}
.hero h1 em{font-style:normal;background:var(--brand);padding:0 8px;border-radius:10px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.wcards{display:grid;gap:12px}
.wcard{border:2px solid var(--ink);border-radius:24px;padding:20px;cursor:pointer;background:#fff;text-align:left;transition:transform .25s var(--spring),box-shadow .25s}
.wcard:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(17,17,17,.12)}
.wcard.lime{background:var(--brand)}
.wcard b{display:block;font-size:19px;margin-bottom:4px}

/* teacher cards */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.tgrid .card{margin:0;display:flex;flex-direction:column}
.tc-top{display:flex;gap:12px;align-items:flex-start}
.tc-name{font-weight:800;font-size:17px;margin:0}
.tc-meta{font-size:13px;color:var(--muted);margin-top:3px}
.tc-line{display:flex;gap:8px;font-size:13.5px;margin-top:8px;align-items:flex-start}
.tc-line i{font-style:normal;width:18px;flex:none;text-align:center}
.tc-actions{display:flex;gap:8px;margin-top:auto;padding-top:14px}
.tc-actions .btn{flex:1;padding:0 8px;white-space:nowrap}
.fee{font-weight:800;font-size:15px;margin-top:8px}
.carousel{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.carousel .card{flex:0 0 250px;scroll-snap-align:start;margin:0}

/* map */
.map{height:320px;border-radius:20px;overflow:hidden;border:2px solid var(--ink);z-index:1}
@media(max-width:640px){.map{height:260px}}
.leaflet-popup-content{font-family:"Plus Jakarta Sans",system-ui,sans-serif;margin:12px 14px}
.leaflet-popup-content .btn{margin-top:8px;width:100%;min-height:38px;font-size:13px}
.mpin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--brand);border:2.5px solid var(--ink);display:grid;place-items:center}
.mpin span{transform:rotate(45deg);font-size:13px}
.mpin.req{background:#fff}.mpin.me{background:var(--ink)}.mpin.me span{color:#fff}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}
.stat{border:1.5px solid var(--line);border-radius:18px;padding:13px}
.stat .l{font-size:12px;font-weight:700;color:var(--muted)}.stat .v{font-size:22px;font-weight:800;margin-top:4px}

/* chat */
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:420px;border:1.5px solid var(--line);border-radius:22px;overflow:hidden}
.chathead{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1.5px solid var(--line)}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px;background:#fafafa}
.bub{max-width:76%;padding:9px 13px;border-radius:18px;font-size:14.5px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;animation:rise .3s var(--ease)}
.bub.me{align-self:flex-end;background:var(--brand);border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:#fff;border:1.5px solid var(--line);border-bottom-left-radius:6px}
.bub time{display:block;font-size:10.5px;color:var(--muted);margin-top:3px}
.sendbar{display:flex;gap:8px;padding:10px;border-top:1.5px solid var(--line);background:#fff}
.sendbar textarea{flex:1;min-height:46px;max-height:120px;resize:none}
.convo{display:flex;gap:12px;align-items:center;padding:13px;border-radius:18px;cursor:pointer;border:1.5px solid var(--line);margin-bottom:10px;background:#fff;width:100%;text-align:left}
.convo:hover{background:var(--soft)}

/* plans */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:800px){.plans{grid-template-columns:1fr}}
.plans .card{margin:0;display:flex;flex-direction:column}
.plans .card .btn{margin-top:auto}
.price{font-size:24px;font-weight:800;margin:6px 0 2px}
.feat{display:flex;gap:8px;font-size:14px;margin:6px 0}

/* faq */
details.q{border:1.5px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:9px;background:#fff}
details.q summary{font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.q summary::after{content:"+";font-size:20px;line-height:1}
details.q[open] summary::after{content:"–"}
details.q p{margin:10px 0 2px;color:var(--muted);line-height:1.5}

/* steps */
.steps{display:flex;gap:6px;margin:10px 0 18px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--ink)}
.upl{display:flex;align-items:center;gap:12px;border:2px dashed var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.photo{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:14px}

/* overlays */
#over{position:fixed;inset:0;z-index:100;display:none}
#over.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(17,17,17,.45);animation:fade .25s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,560px);max-height:92vh;overflow-y:auto;background:#fff;border-radius:26px 26px 0 0;padding:22px 20px 26px;animation:up .35s var(--ease)}
@media(min-width:700px){.sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:26px;animation:pop .3s var(--ease)}}
@keyframes up{from{transform:translate(-50%,100%)}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%)}}
.sheet .x{position:absolute;right:14px;top:14px;width:38px;height:38px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;font-size:16px}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(92vw,360px);background:#fff;display:flex;flex-direction:column;animation:slide .3s var(--ease)}
@keyframes slide{from{transform:translateX(100%)}}
.drawer .dh{background:var(--brand);padding:22px 18px;display:flex;gap:12px;align-items:center}
.drawer .dl{flex:1;overflow-y:auto;padding:14px}
.mcard{display:flex;gap:12px;align-items:center;width:100%;border:1.5px solid var(--line);border-radius:18px;padding:14px;background:#fff;cursor:pointer;text-align:left;margin-bottom:10px;transition:transform .2s var(--spring)}
.mcard:hover{transform:translateX(-3px);border-color:var(--ink)}
.mcard b{display:block}.mcard small{color:var(--muted)}
.mcard .ic{width:42px;height:42px;border-radius:13px;background:var(--brand);display:grid;place-items:center;font-size:19px;flex:none}

/* toast & loader */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,480px)}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;font-size:14px;animation:rise .3s var(--ease);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.bad{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.spin{width:30px;height:30px;border:3.5px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{background:var(--soft);border-radius:20px;padding:28px;text-align:center}
.empty b{display:block;font-size:17px;margin-bottom:4px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sec h2,.sec h3{margin:0}
footer.ft{max-width:1080px;margin:0 auto;padding:20px 16px 40px;color:var(--muted);font-size:13px;display:flex;gap:16px;flex-wrap:wrap}
footer.ft a{text-decoration:none;font-weight:700}
.atable{width:100%;border-collapse:collapse;background:#fff;border:2px solid #111;border-radius:16px;overflow:hidden;font-size:14px}
.atable th{background:#111;color:#fff;text-align:left;padding:10px 12px;font-weight:800;white-space:nowrap}
.atable td{padding:10px 12px;border-top:1px solid #eee;vertical-align:top}
.atable tr:nth-child(even) td{background:#fafafa}
</style>
</head>
